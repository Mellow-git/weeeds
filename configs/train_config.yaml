# Training hyperparameters (tuned for RTX 3050 6GB VRAM)

base_weights: models/pretrained/yolov8n-seg.pt
dataset: configs/dataset.yaml
output_dir: models/finetuned
run_name: crop_weed_seg

epochs: 100
batch: 8  # lower to 4 if OOM on 6GB VRAM
imgsz: 640
lr0: 0.01
lrf: 0.01
patience: 20
workers: 4
device: "0"

# Augmentation (Ultralytics defaults can be overridden here)
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 5.0
flipud: 0.0
fliplr: 0.5
mosaic: 1.0

# Export after training
export_onnx: false
